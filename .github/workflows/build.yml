name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix Missing Gradle Version Catalog
      run: |
        mkdir -p gradle
        if [ ! -f "gradle/libs.versions.toml" ]; then
          echo '[versions]' > gradle/libs.versions.toml
          echo 'agp = "8.2.0"' >> gradle/libs.versions.toml
          echo 'kotlin = "1.9.0"' >> gradle/libs.versions.toml
          echo '[plugins]' >> gradle/libs.versions.toml
          echo 'android-application = { id = "com.android.application", version.ref = "agp" }' >> gradle/libs.versions.toml
          echo 'kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }' >> gradle/libs.versions.toml
          echo 'kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }' >> gradle/libs.versions.toml
        fi

    - name: Restructure Project Files
      run: |
        mkdir -p app/src/main/java/com/example/app
        find . -maxdepth 1 -name "*.kt" -exec mv {} app/src/main/java/com/example/app/ \; 2>/dev/null || true
        if [ -f "AndroidManifest.xml" ]; then
          mkdir -p app/src/main
          mv AndroidManifest.xml app/src/main/
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: gradle assembleDebug --continue || gradle build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/*.apk"
