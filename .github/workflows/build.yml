name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Restructure Project Files
      run: |
        mkdir -p app/src/main/java/com/example/app
        # Move Kotlin files to src directory if needed
        find . -maxdepth 1 -name "*.kt" -exec mv {} app/src/main/java/com/example/app/ \; 2>/dev/null || true
        # Move AndroidManifest.xml if in root
        if [ -f "AndroidManifest.xml" ]; then
          mkdir -p app/src/main
          mv AndroidManifest.xml app/src/main/
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK with Gradle
      run: gradle assembleDebug --continue || gradle build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/*.apk"
